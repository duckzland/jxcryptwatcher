name: Build JXWatcher Binaries

## For debugging the workflow only:
# on:
#   push:
#     branches: [master]

## Make trigger based on tags:
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Setup go winres dependencies
        run: go install github.com/tc-hib/go-winres@latest

      - name: Setup Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest
      
      - name: Install dependencies for cross compiling
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev gcc-mingw-w64 wixl uuid-runtime gcc-aarch64-linux-gnu g++-aarch64-linux-gnu curl unzip rpm

      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(grep '^version=' version.txt | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and prepare Android NDK
        run: ./download-ndk.sh r29

      - name: Run pre-build script
        run: ./before-build.sh live

      - name: Cross-compile and packages
        run: ./build-linux.sh && ./build-windows.sh && ./build-debian.sh && ./build-android.sh && ./build-rpm.sh

      - name: Clean build folders
        run: rm -rf build/libs

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

